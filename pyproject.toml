[project]
name = "local-dictation"
version = "0.1.0"
description = "Small local-first macOS menu-bar dictation app"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mlx-whisper>=0.4.3",
    "numpy>=2.0",
    "pynput>=1.8",
    "pyobjc-framework-Cocoa>=10",
    "rumps>=0.4",
    "sounddevice>=0.5",
]

[project.scripts]
local-dictation = "local_dictation.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_dictation"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
